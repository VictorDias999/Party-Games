<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rastreamento do Pedido</title>
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1, h2 {
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background-color: #1f1f1f;
      padding: 20px;
      border-radius: 10px;
    }

    .section {
      margin-bottom: 20px;
    }

    .label {
      font-weight: bold;
      color: #00ff88;
      margin-top: 10px;
      display: block;
    }

    .status {
      font-size: 1.2em;
      font-weight: bold;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      margin-bottom: 15px;
    }

    .status.preparo { background-color: #ff9800; color: #121212; }
    .status.enviado { background-color: #2196f3; color: white; }
    .status.entregue { background-color: #4caf50; color: white; }

    .produto {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
    }

    .produto img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      border-radius: 5px;
    }

    .btn-voltar {
      display: block;
      margin: 30px auto 0;
      padding: 10px 20px;
      background-color: #0077ff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
    }
  </style>
</head>
<body>
  <h1>Rastreamento do Pedido</h1>

  <div class="container">
    <div class="section">
      <span class="label">Código de Rastreio:</span>
      <p id="codigoRastreio"></p>

      <div id="statusPedido" class="status"></div>
    </div>

    <div class="section">
      <h2>Dados do Cliente</h2>
      <p id="dadosCliente"></p>
    </div>

    <div class="section">
      <h2>Produtos</h2>
      <div id="listaProdutos"></div>
    </div>

    <button class="btn-voltar" onclick="voltarPaginaInicial()">Voltar para a Página Inicial</button>
  </div>
<script>
  const usuario = JSON.parse(localStorage.getItem("usuario"));
  const carrinho = JSON.parse(localStorage.getItem("carrinhoAntigo"));
  const codigoPagamento = localStorage.getItem("codigoPagamento");

  // Gerador de código de rastreio estilo Correios
  function gerarCodigoCorreios() {
    const prefixo = "PM"; // ou "LB", "BR", etc.
    const sufixo = "BR";
    const numeros = Math.floor(Math.random() * 900000000 + 100000000); // 9 dígitos
    return `${prefixo}${numeros}BR`;
  }

  const codigoCorreios = gerarCodigoCorreios();

  const statusSimulado = ["preparo", "enviado", "entregue"];
  const statusAleatorio = statusSimulado[Math.floor(Math.random() * statusSimulado.length)];

  function carregarRastreio() {
    if (!usuario || !carrinho || !codigoPagamento) {
      alert("Pedido não encontrado.");
      window.location.href = "paginainicial.html";
      return;
    }

    document.getElementById("codigoRastreio").innerHTML = `
      ${codigoCorreios}<br>
      <a href="https://www2.correios.com.br/sistemas/rastreamento/default.cfm" 
         target="_blank" style="color:#00ff88; text-decoration:underline;">
         Rastrear nos Correios
      </a>
    `;

    document.getElementById("statusPedido").innerText = `Status: ${statusAleatorio.charAt(0).toUpperCase() + statusAleatorio.slice(1)}`;
    document.getElementById("statusPedido").classList.add(statusAleatorio);

    document.getElementById("dadosCliente").innerHTML = `
      <strong>Nome:</strong> ${usuario.nome}<br>
      <strong>Email:</strong> ${usuario.email}<br>
      <strong>Endereço:</strong> ${usuario.endereco}<br>
    `;

    const lista = document.getElementById("listaProdutos");
    carrinho.forEach(item => {
      const div = document.createElement("div");
      div.className = "produto";
      div.innerHTML = `
        <img src="${item.imagem}" alt="${item.nome}" />
        <span>${item.nome} - R$ ${item.preco.toFixed(2)}</span>
      `;
      lista.appendChild(div);
    });
  }

  function voltarPaginaInicial() {
    window.location.href = "paginainicial.html";
  }

  carregarRastreio();
</script>
</body>
</html>
